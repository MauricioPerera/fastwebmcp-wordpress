name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check committed bundles
        run: git diff --exit-code -- assets
      - name: PHP syntax
        run: find . -maxdepth 1 -name '*.php' -exec php -l {} \;
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: fastwebmcp-wordpress
          path: dist/fastwebmcp-wordpress.zip
